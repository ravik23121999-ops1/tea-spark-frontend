<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="cursor: pointer;">
  <style>
    .tea-leaf {
      transition: all 0.3s ease;
      transform-origin: center;
    }
    .tea-leaf:hover {
      filter: brightness(1.2);
      transform: scale(1.05);
    }
    .sparkle {
      transition: all 0.2s ease;
    }
    .tea-leaf:hover .sparkle {
      animation: sparkle-burst 0.6s ease-in-out;
    }
    @keyframes sparkle-burst {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.5); opacity: 1; }
    }
    .steam {
      transition: all 0.3s ease;
    }
    .tea-leaf:hover .steam {
      opacity: 0.6;
    }
  </style>
  
  <!-- Tea leaf shape -->
  <g class="tea-leaf">
    <path d="M20 8C20 8 12 12 12 20C12 26 16 30 20 30C24 30 28 26 28 20C28 12 20 8 20 8Z" 
          fill="currentColor" opacity="0.9"/>
    
    <!-- Leaf vein -->
    <path d="M20 8L20 28" stroke="white" stroke-width="1" opacity="0.6"/>
    <path d="M20 15L16 18" stroke="white" stroke-width="0.5" opacity="0.4"/>
    <path d="M20 20L24 22" stroke="white" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Sparkles around the leaf -->
    <g class="sparkle" opacity="0.8">
      <!-- Top left sparkle -->
      <circle cx="10" cy="10" r="1.5" fill="currentColor">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Top right sparkle -->
      <circle cx="30" cy="10" r="1.5" fill="currentColor">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Bottom left sparkle -->
      <circle cx="10" cy="30" r="1.5" fill="currentColor">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Bottom right sparkle -->
      <circle cx="30" cy="30" r="1.5" fill="currentColor">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Steam effect -->
    <g class="steam" opacity="0.3">
      <path d="M15 6Q14 4 15 2" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M15 6Q14 4 15 2;M15 6Q16 4 15 2;M15 6Q14 4 15 2" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M20 6Q19 4 20 2" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M20 6Q19 4 20 2;M20 6Q21 4 20 2;M20 6Q19 4 20 2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M25 6Q24 4 25 2" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M25 6Q24 4 25 2;M25 6Q26 4 25 2;M25 6Q24 4 25 2" dur="3s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
